<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>AI Scan - Plasmax AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>AI Fault Scan</h2>
        <p>মেশিনের ডিসপ্লে বা ফল্ট কোডের ছবি তুলুন:</p>
        
        <input type="file" id="faultImage" accept="image/*" capture="environment">
        <br><br>
        <button onclick="analyzeFault()">স্ক্যান করুন (Analyze)</button>
        
        <div id="result" class="result-box">
            ফলাফল দেখার জন্য ছবি তুলুন এবং স্ক্যান বাটনে চাপ দিন।
        </div>
        
        <br>
        <a href="index.html">← হোম পেজে ফিরে যান</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
